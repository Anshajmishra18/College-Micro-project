<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Login · CampusDesk</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body class="login-body"><main class="login-card"><div class="brand-mark">C</div><div class="eyebrow">CAMPUSDESK · TEACHER PORTAL</div><h1>Welcome back</h1><p>Sign in to manage student records and attendance.</p>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<form method="post"><label>Username<input name="username" required autocomplete="username"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button class="button primary" type="submit">Sign in →</button></form><div class="demo-login"><b>Demo login</b><br>Username: <code>teacher</code><br>Password: <code>teacher123</code></div></main></body></html>
